name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...
      - name: Test with coverage
        run: |
          go test -race -coverprofile="$RUNNER_TEMP/cover.out" ./...
          go tool cover -func="$RUNNER_TEMP/cover.out" | awk '/^total:/ { sub(/%$/, "", $3); found=1; if ($3+0 < 90) exit 1 } END { if (!found) exit 1 }'
      - name: SAGE extension module
        working-directory: advanced/sage
        run: |
          go vet ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...
          go test -race -coverprofile="$RUNNER_TEMP/sage-cover.out" ./...
          go tool cover -func="$RUNNER_TEMP/sage-cover.out" | awk '/^total:/ { sub(/%$/, "", $3); found=1; if ($3+0 < 90) exit 1 } END { if (!found) exit 1 }'

      - name: Record key timestamp validation evidence
        run: |
          go test -count=1 -json -run '^TestKeyTimestampInputs$' ./consumer > "$RUNNER_TEMP/key-timestamp-tests.jsonl"
          go tool cover -func="$RUNNER_TEMP/cover.out" > "$RUNNER_TEMP/coverage-functions.txt"
          awk '$2 == "readTime" { value=$NF; sub(/%$/, "", value); found++; if (value+0 < 90) bad=1 } END { if (found != 1 || bad) exit 1 }' "$RUNNER_TEMP/coverage-functions.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/revision.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/tree.txt"
          go version > "$RUNNER_TEMP/compiler.txt"
          sha256sum consumer/read.go consumer/datetime_test.go docs/key-timestamp-inputs.md .github/workflows/ci.yml > "$RUNNER_TEMP/source.sha256"
      - name: Upload key timestamp validation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: key-timestamp-validation
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/key-timestamp-tests.jsonl
            ${{ runner.temp }}/cover.out
            ${{ runner.temp }}/sage-cover.out
            ${{ runner.temp }}/coverage-functions.txt
            ${{ runner.temp }}/revision.txt
            ${{ runner.temp }}/tree.txt
            ${{ runner.temp }}/compiler.txt
            ${{ runner.temp }}/source.sha256

      - name: Record dereferencing option validation evidence
        run: |
          go test -count=1 -json -run '^Test(IntermediateDocumentResolution|IntermediateDocumentFailures|IntermediateResolverIsolation|StrictDereferencerIsNotReconfigured|ForwardedDereferenceOptions)$' ./resolver ./dereferencer > "$RUNNER_TEMP/dereferencing-option-tests.jsonl"
          go tool cover -func="$RUNNER_TEMP/cover.out" > "$RUNNER_TEMP/option-coverage-functions.txt"
          awk '$2 == "ForDereferencing" { value=$NF; sub(/%$/, "", value); found++; if (value+0 < 90) bad=1 } END { if (found != 1 || bad) exit 1 }' "$RUNNER_TEMP/option-coverage-functions.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/option-revision.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/option-tree.txt"
          go version > "$RUNNER_TEMP/option-compiler.txt"
          sha256sum dereferencer/dereferencer.go dereferencer/dereferencer_test.go dereferencer/forwarding_test.go resolver/resolver.go resolver/intermediate_test.go resolution/universal/content_test.go didkit/didkit.go docs/07-did-resolution-contract.md docs/12-standard-core-and-sage-extension.md docs/dereferencing-options.md .github/workflows/ci.yml > "$RUNNER_TEMP/option-source.sha256"
      - name: Upload dereferencing option validation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dereferencing-option-validation
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/dereferencing-option-tests.jsonl
            ${{ runner.temp }}/cover.out
            ${{ runner.temp }}/sage-cover.out
            ${{ runner.temp }}/option-coverage-functions.txt
            ${{ runner.temp }}/option-revision.txt
            ${{ runner.temp }}/option-tree.txt
            ${{ runner.temp }}/option-compiler.txt
            ${{ runner.temp }}/option-source.sha256

      - name: Record metadata presence evidence
        run: |
          go test -count=1 -json -run '^Test(MetadataBooleanPresence|ProxiedMetadataPresence)$' ./document ./resolution/universal > "$RUNNER_TEMP/metadata-tests.jsonl"
          go tool cover -func="$RUNNER_TEMP/cover.out" > "$RUNNER_TEMP/metadata-coverage.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/metadata-revision.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/metadata-tree.txt"
          go version > "$RUNNER_TEMP/metadata-compiler.txt"
          sha256sum document/metadata.go document/metadata_presence_test.go resolution/universal/metadata_presence_test.go docs/metadata-presence.md .github/workflows/ci.yml > "$RUNNER_TEMP/metadata-source.sha256"
      - name: Upload metadata presence evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: metadata-presence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/metadata-*.jsonl
            ${{ runner.temp }}/metadata-*.txt
            ${{ runner.temp }}/metadata-source.sha256
            ${{ runner.temp }}/cover.out
            ${{ runner.temp }}/sage-cover.out

      - name: Record recursive fragment evidence
        run: |
          go test -count=1 -json -run '^Test(RecursiveFragmentMaps|FragmentNumbersAndFirstMatch|FragmentPublicBoundaryAndInvalidContainers|RecursiveFragmentTLS)$' ./dereferencer ./resolution/universal > "$RUNNER_TEMP/fragment-tests.jsonl"
          go tool cover -func="$RUNNER_TEMP/cover.out" > "$RUNNER_TEMP/fragment-coverage.txt"
          awk '$2 == "findFragment" || $2 == "findMethodFragment" || $2 == "findJSONFragment" { value=$NF; sub(/%$/, "", value); found++; if (value+0 < 90) bad=1 } END { if (found != 3 || bad) exit 1 }' "$RUNNER_TEMP/fragment-coverage.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/fragment-revision.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/fragment-tree.txt"
          go version > "$RUNNER_TEMP/fragment-compiler.txt"
          sha256sum dereferencer/dereferencer.go dereferencer/fragment.go dereferencer/fragment_recursion_test.go resolution/universal/fragment_recursion_test.go docs/recursive-fragments.md .github/workflows/ci.yml > "$RUNNER_TEMP/fragment-source.sha256"
      - name: Upload recursive fragment evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: recursive-fragments
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/fragment-*.jsonl
            ${{ runner.temp }}/fragment-*.txt
            ${{ runner.temp }}/fragment-source.sha256
            ${{ runner.temp }}/cover.out
            ${{ runner.temp }}/sage-cover.out

      - name: Record nested expansion evidence
        run: |
          go test -count=1 -json -run '^Test(ExpandNestedPublicMaps|ExpandJSONPreservesValues|ExpandRelationshipsAndPublicBoundary|ExpandRelativeOptionControls|ExpandReferenceControls|NestedExpansionTLS)$' ./resolver ./resolution/universal > "$RUNNER_TEMP/expansion-tests.jsonl"
          go tool cover -func="$RUNNER_TEMP/cover.out" > "$RUNNER_TEMP/expansion-coverage.txt"
          awk '$1 ~ /\/resolver\/expand.go:/ && ($2 == "expand" || $2 == "expandMethod" || $2 == "expandJSONMap" || $2 == "expandJSONValue") { value=$NF; sub(/%$/, "", value); found++; if (value+0 < 90) bad=1 } END { if (found != 4 || bad) exit 1 }' "$RUNNER_TEMP/expansion-coverage.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/expansion-revision.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/expansion-tree.txt"
          go version > "$RUNNER_TEMP/expansion-compiler.txt"
          sha256sum resolver/expand.go resolver/expand_nested_test.go resolution/universal/expansion_nested_test.go docs/nested-relative-identifiers.md .github/workflows/ci.yml > "$RUNNER_TEMP/expansion-source.sha256"
      - name: Upload nested expansion evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nested-expansion
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/expansion-*.jsonl
            ${{ runner.temp }}/expansion-*.txt
            ${{ runner.temp }}/expansion-source.sha256
            ${{ runner.temp }}/cover.out
            ${{ runner.temp }}/sage-cover.out

      - name: Record primary resource URL evidence
        run: |
          go test -count=1 -json -run '^TestPrimaryResource' ./dereferencer ./resolution/universal > "$RUNNER_TEMP/resource-tests.jsonl"
          go tool cover -func="$RUNNER_TEMP/cover.out" > "$RUNNER_TEMP/resource-coverage.txt"
          awk '($1 ~ /\/dereferencer\/dereferencer.go:/ && $2 == "resource") || ($1 ~ /\/did\/url.go:/ && $2 == "WithoutFragment") {value=$NF; sub(/%$/, "", value); found++; if (value+0 < 90) bad=1} END {if (found != 2 || bad) exit 1}' "$RUNNER_TEMP/resource-coverage.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/resource-revision.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/resource-tree.txt"
          go version > "$RUNNER_TEMP/resource-compiler.txt"
          sha256sum dereferencer/dereferencer.go dereferencer/primary_resource_test.go resolution/universal/primary_resource_test.go docs/primary-resource-urls.md docs/07-did-resolution-contract.md .github/workflows/ci.yml > "$RUNNER_TEMP/resource-source.sha256"
      - name: Upload primary resource URL evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: primary-resource-urls
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/resource-*.jsonl
            ${{ runner.temp }}/resource-*.txt
            ${{ runner.temp }}/resource-source.sha256
            ${{ runner.temp }}/cover.out
            ${{ runner.temp }}/sage-cover.out

  standalone-sage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: advanced/sage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
      - name: Verify the public root dependency
        run: |
          go mod download
          go mod verify
          go list -mod=readonly -m -json all > "$RUNNER_TEMP/standalone-modules.json"
          go list -mod=readonly -m -json github.com/sage-x-project/did-go > "$RUNNER_TEMP/standalone-root.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = json.loads((Path(os.environ['RUNNER_TEMP']) / 'standalone-root.json').read_text())
          assert root['Path'] == 'github.com/sage-x-project/did-go'
          assert root['Version'] == 'v0.0.0-20261018080828-3b7a79c1c326'
          assert root['Sum'] == 'h1:Am4pVUAnGnhje6WZgO19ltbRV1NDCfvmEzQAuwHInM8='
          assert root['GoModSum'] == 'h1:Xi8PmTFqnTT9F008Q4MvrZc6KFrtcrXBP/e1dH8mFaQ='
          assert not root.get('Replace') and not root.get('Main')
          PYTHON
          go env GOWORK GOTOOLCHAIN > "$RUNNER_TEMP/standalone-environment.txt"
          test "$(go env GOWORK)" = off
          test "$(go env GOTOOLCHAIN)" = local
          go version > "$RUNNER_TEMP/standalone-compiler.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/standalone-revision.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/standalone-tree.txt"
          sha256sum go.mod go.sum standalone_tls_test.go ../../docs/standalone-sage.md ../../.github/workflows/ci.yml > "$RUNNER_TEMP/standalone-source.sha256"
      - name: Build and check the standalone module
        run: |
          test -z "$(gofmt -l .)"
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...
          git diff --exit-code -- go.mod go.sum
      - name: Test the standalone module and owned TLS boundary
        run: |
          go test -mod=readonly -count=1 -race -json -coverprofile="$RUNNER_TEMP/standalone-cover.out" ./... > "$RUNNER_TEMP/standalone-tests.jsonl"
          go tool cover -func="$RUNNER_TEMP/standalone-cover.out" > "$RUNNER_TEMP/standalone-coverage.txt"
          awk '/^total:/ {sub(/%$/, "", $3); found=1; if ($3+0 < 90) exit 1} END {if (!found) exit 1}' "$RUNNER_TEMP/standalone-coverage.txt"
          git diff --exit-code -- go.mod go.sum
      - name: Record SAGE response contract evidence
        run: |
          go test -mod=readonly -count=1 -race -json -run '^TestSAGE(ResponseMetadata|AcceptDiagnostics|ResponseTLS)$' ./... > "$RUNNER_TEMP/sage-response-tests.jsonl"
          sha256sum projection.go resolver.go projection_test.go resolver_test.go response_contract_test.go ../../docs/sage-response-fields.md ../../.github/workflows/ci.yml > "$RUNNER_TEMP/sage-response-source.sha256"
      - name: Upload SAGE response contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sage-response-fields
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/sage-response-tests.jsonl
            ${{ runner.temp }}/sage-response-source.sha256
            ${{ runner.temp }}/standalone-*.json
            ${{ runner.temp }}/standalone-*.txt
            ${{ runner.temp }}/standalone-cover.out
      - name: Upload standalone module evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: standalone-sage
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/standalone-*.json
            ${{ runner.temp }}/standalone-*.jsonl
            ${{ runner.temp }}/standalone-*.txt
            ${{ runner.temp }}/standalone-source.sha256
            ${{ runner.temp }}/standalone-cover.out
      - name: Record paired view evidence
        run: |
          go test -mod=readonly -count=1 -race -json -run '^Test(ObserveViews.*|SnapshotRecordOwnsMutableMembers)$' ./... > "$RUNNER_TEMP/paired-tests.jsonl"
          go tool cover -func="$RUNNER_TEMP/standalone-cover.out" > "$RUNNER_TEMP/paired-coverage.txt"
          awk '$1 ~ /\/views.go:/ && ($2 == "ObserveViews" || $2 == "snapshotRecord") {value=$NF; sub(/%$/, "", value); found++; if (value+0 < 90) bad=1} END {if (found != 2 || bad) exit 1}' "$RUNNER_TEMP/paired-coverage.txt"
          sha256sum views.go views_test.go ../../docs/paired-sage-views.md ../../.github/workflows/ci.yml > "$RUNNER_TEMP/paired-source.sha256"
      - name: Upload paired view evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paired-sage-views
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/paired-*.jsonl
            ${{ runner.temp }}/paired-*.txt
            ${{ runner.temp }}/paired-source.sha256
            ${{ runner.temp }}/standalone-*.json
            ${{ runner.temp }}/standalone-*.txt
            ${{ runner.temp }}/standalone-cover.out
